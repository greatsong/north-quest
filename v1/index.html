<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1726">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23ff5a4e%22/%3E%3Cpath d=%22M8 36l18-5 9-19h6l-3 17 13-3 3-7h4l-1 12 1 12h-4l-3-7-13-3 3 17h-6l-9-19-18-5z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<title>북녘 탐험대 · 하늘길 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="vignette"></div>

<div id="ui">
  <!-- 불러오기 -->
  <section id="scr-loading" class="screen show">
    <div class="load-box">
      <div class="load-logo">북녘 탐험대</div>
      <div class="load-sub">하늘길 탐험대</div>
      <div class="load-bar"><i id="load-bar"></i></div>
      <p id="load-msg">불러오는 중입니다</p>
    </div>
  </section>

  <!-- 타이틀 -->
  <section id="scr-title" class="screen">
    <div class="title-wrap">
      <div class="title-kicker"><span>NORTH QUEST</span> 하늘길 탐험대</div>
      <h1 class="title-main"><span class="t1">북녘</span><span class="t2">탐험대</span></h1>
      <p class="title-sub">작은 탐사 비행기를 타고 한반도 북쪽의 산과 강, 역사 유적을 찾아 날아갑니다.</p>
      <div class="title-btns">
        <button class="btn mode-btn fly" data-act="explore">
          <span class="mb-ico"><svg viewBox="0 0 48 48"><path d="M4 26l16-4 8-16h5l-3 15 12-3 3-6h3l-1 10 1 10h-3l-3-6-12-3 3 15h-5l-8-16-16-4z" fill="currentColor"/></svg></span>
          <span class="mb-txt"><b>탐험 비행</b><small>미션을 따라 장소를 찾아 날아갑니다</small></span>
        </button>
        <button class="btn mode-btn pin" data-act="guess">
          <span class="mb-ico"><svg viewBox="0 0 48 48"><path d="M14 44V6" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M16 7l24 8-24 9z" fill="currentColor"/></svg></span>
          <span class="mb-txt"><b>위치 맞히기</b><small>지도에 깃발을 꽂아 위치를 맞힙니다</small></span>
        </button>
      </div>
      <div class="title-row">
        <button class="btn pill" data-act="dex">도감 <span id="dex-count" class="pill-num">0/43</span></button>
        <button class="btn pill" data-act="info">정보·출처</button>
      </div>
    </div>
    <div class="title-foot">장소 설명·문제: 교사 검토용 초안 · 지명은 북한 현행 표기</div>
  </section>

  <!-- 난이도 -->
  <section id="scr-level" class="screen">
    <div class="menu-wrap">
      <button class="btn ghost back" data-act="title">처음으로</button>
      <h2 id="level-title" class="menu-title">난이도 선택</h2>
      <div class="level-cards">
        <button class="level-card l1" data-level="1"><div class="lv-badge">1</div><div class="lv-main"><b>기초</b><span class="lv-stars">★<i>★★</i></span></div><p id="lv1-desc"></p><span class="lv-best" id="lv1-best"></span></button>
        <button class="level-card l2" data-level="2"><div class="lv-badge">2</div><div class="lv-main"><b>보통</b><span class="lv-stars">★★<i>★</i></span></div><p id="lv2-desc"></p><span class="lv-best" id="lv2-best"></span></button>
        <button class="level-card l3" data-level="3"><div class="lv-badge">3</div><div class="lv-main"><b>도전</b><span class="lv-stars">★★★</span></div><p id="lv3-desc"></p><span class="lv-best" id="lv3-best"></span></button>
      </div>
    </div>
  </section>

  <!-- 미션 선택 -->
  <section id="scr-mission" class="screen">
    <div class="menu-wrap wide">
      <button class="btn ghost back" data-act="back-level">난이도 다시 고르기</button>
      <h2 class="menu-title">미션 선택 <span class="lv-chip" id="mission-level">기초</span></h2>
      <div id="mission-list" class="mission-list"></div>
    </div>
  </section>

  <!-- 결과 -->
  <section id="scr-result" class="screen"></section>

  <!-- 탐험 HUD -->
  <section id="hud-explore" class="hud">
    <div class="hud-tl panel">
      <div class="hud-mission"><span id="hx-mname"></span><span id="hx-level" class="lv-chip"></span></div>
      <div class="hud-progress" id="hx-progress"></div>
      <div class="hud-score"><b id="hx-score">0</b><small>점</small><span id="hx-combo" class="combo"></span></div>
    </div>
    <div class="hud-compass"><canvas id="hx-cmp"></canvas><div class="cmp-center"></div></div>
    <div class="hud-tr">
      <button id="hx-dex" class="icon-btn" title="도감"></button>
      <button id="hx-pause" class="icon-btn" title="일시정지"></button>
    </div>
    <div class="hud-riddle panel" id="hx-riddle">
      <div class="rd-kicker"><span>다음 목적지</span><b id="hx-dist"></b></div>
      <p id="hx-rtext"></p>
      <p id="hx-rhint" class="rd-hint"></p>
    </div>
    <div class="hud-fuel panel">
      <div class="fuel-label"><span>연료</span><span id="hx-speed">0 km/h</span></div>
      <div class="fuel-bar"><i id="hx-fuel"></i></div>
    </div>
    <canvas id="hx-mini" class="minimap"></canvas>
    <div id="hx-arrow" class="edge-arrow"><div class="ea-arrow"></div><div class="ea-dist"></div></div>
    <div id="hx-gate-arrow" class="edge-arrow gold"><div class="ea-arrow"></div><div class="ea-dist"></div></div>
    <div id="hx-cluster" class="cluster-panel panel"></div>
    <div class="touch-ctl">
      <div id="joy" class="joy"><div class="joy-ring"></div><div class="joy-knob"></div></div>
      <button id="boost-btn" class="boost-btn">가속</button>
    </div>
    <div class="hud-help">W S 상승·하강 · A D 선회 · Shift 가속 · Esc 일시정지</div>
    <div id="speedlines"></div>
  </section>

  <!-- 위치 맞히기 HUD -->
  <section id="hud-guess" class="hud">
    <div class="hud-tl panel">
      <div class="hud-mission"><span>위치 맞히기</span><span id="gq-level" class="lv-chip"></span></div>
      <div class="hud-round">문제 <b id="gq-round">1 / 10</b></div>
      <div class="hud-score"><b id="gq-score">0</b><small>점</small></div>
    </div>
    <div class="hud-tr">
      <button id="gq-tilt" class="icon-btn" title="기울이기"></button>
      <button id="gq-pause" class="icon-btn" title="일시정지"></button>
    </div>
    <div id="gq-box" class="gq-box panel">
      <h2 id="gq-q"></h2>
      <div id="gq-hint" class="gq-hint"></div>
      <div id="gq-timer" class="gq-timer"><div class="gq-tbar"><i id="gq-time"></i></div><b id="gq-tnum">30</b></div>
    </div>
    <button id="gq-confirm" class="btn primary big gq-confirm" disabled>깃발 꽂기</button>
    <div class="gq-help">지도를 눌러 위치를 고른 뒤 깃발 꽂기 · 드래그 이동 · 휠 확대 · 오른쪽 드래그 기울이기</div>
    <div id="gq-result" class="gq-result panel"></div>
  </section>

  <div id="viewbar" class="viewbar panel"></div>
</div>

<canvas id="fx"></canvas>
<div id="banner-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<button id="btn-mute" class="icon-btn mute" title="소리 켜기·끄기"></button>
<pre id="err"></pre>
<div id="dbg"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
